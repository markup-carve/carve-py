[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "carve-lang"
version = "0.1.1"
description = "Python bindings for the Carve markup language (native PyO3 binding over carve-rs)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "markup-carve" }]
keywords = ["carve", "markup", "parser", "html", "djot", "mkdocs", "sphinx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://markup-carve.github.io/carve/"
Repository = "https://github.com/markup-carve/carve-py"
Documentation = "https://github.com/markup-carve/carve-py#readme"
Changelog = "https://github.com/markup-carve/carve-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/markup-carve/carve-py/issues"

[tool.maturin]
# The Rust cdylib is named `carve` (see Cargo.toml [lib]); maturin builds an
# abi3 wheel from the abi3-py38 feature, so one wheel covers Python 3.8+.
# module-name must be set explicitly so the import stays `carve` even though
# the distribution name is `carve-lang`.
module-name = "carve"
features = ["pyo3/extension-module"]
exclude = [
    ".github/**",
    ".gitattributes",
    ".gitignore",
    "scripts/**",
    "tests/**",
]
