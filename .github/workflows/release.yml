name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Runs before the three-OS wheel matrix, so a tag that disagrees with the
  # packaged version or has no notes costs seconds rather than a full build.
  guard:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi

      # The notes live in the repo, so a deleted or rebuilt release loses
      # nothing - and a tag cannot outrun them. PyPI never reuses a version, so
      # discovering missing notes after the upload is unfixable.
      - name: The release notes exist
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ ! -s "$notes" ]; then
            echo "no release notes at $notes" >&2
            exit 1
          fi

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Guard against panic = "abort"
        if: runner.os != 'Windows'
        run: bash scripts/check-panic-unwind.sh

      - name: Build wheels (abi3)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --features pyo3/extension-module --out dist
          # abi3-py38 feature is set in pyproject.toml via [tool.maturin].
          # One wheel covers Python 3.8+ per PEP 384.
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/carve-lang
    steps:
      # The secrets context is not readable from a step-level `if`, so the path
      # is decided here instead. This step only reports whether the secret is
      # set; the token itself reaches no other step, and in particular no
      # third-party action.
      - name: Decide the publish path
        id: auth
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      # The API token is the bootstrap path only. Once `carve-lang` exists on
      # PyPI, configure a trusted publisher there and delete the secret; the
      # step below then takes over and no credential is stored anywhere.
      - name: Publish to PyPI (API token)
        if: steps.auth.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.auth.outputs.mode == 'oidc'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      # The tag carries a leading v, the notes file does not.
      - name: Locate the notes
        id: notes
        run: echo "path=.github/release-notes/${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"

      # Runs after the PyPI upload, so a release page never advertises a
      # version the registry does not have.
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*
          make_latest: true
