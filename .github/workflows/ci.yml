name: Carve 0.2 CI

on:
  push:
    branches: [next2]
  pull_request:
    branches: [next2]
  workflow_dispatch:

jobs:
  msrv:
    name: Build on Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared MSRV
        run: cargo +1.88.0 check --locked

  linux-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: markup-carve/carve
          ref: 11b5dcc89133114887d2e71f6183c7d526f150d0
          path: spec-02
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Rust source and unwind safety
        run: |
          cargo fmt --check
          bash scripts/check-panic-unwind.sh
          cargo check --locked
      - name: Build and install Linux wheel
        run: |
          python -m pip install maturin pytest
          maturin build --release --locked --out dist
          python -m pip install dist/*.whl
      - name: Test the 0.2 binding
        env:
          CARVE_SPEC2_EXAMPLES: spec-02/spec/0.2/conformance/examples.json
        run: python -m pytest -q
