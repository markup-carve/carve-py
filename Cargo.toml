[package]
name = "python-carve"
version = "0.1.7"
edition = "2021"
description = "Python bindings (PyO3) for the Carve markup language, over the carve-rs engine."
license = "MIT"
repository = "https://github.com/markup-carve/carve-py"

[lib]
# The compiled Python extension module is named `carve`.
name = "carve"
crate-type = ["cdylib"]

# IMPORTANT: do NOT set `panic = "abort"` anywhere (no `[profile.release]`
# panic setting here, and none inherited from a workspace). Two separate pieces
# turn a Rust panic into a Python exception a host can handle: `panic = "unwind"`
# (the Cargo default) makes the panic unwindable at all, and `guard` in
# src/lib.rs catches that unwind and raises `carve.EnginePanicError`. Without
# `guard` the panic still reaches Python, since PyO3 catches it too, but as
# `PanicException`, which derives from `BaseException` and so escapes
# `except Exception`. Setting `panic = "abort"` removes the unwind entirely and
# a panic would abort the host Python interpreter. The CI step
# (scripts/check-panic-unwind.sh) enforces the compile flag;
# tests/test_panic_unwind.py covers the other half.

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py38", "extension-module"] }

# --- Carve engine dependency ---------------------------------------------
# Renamed to `carve_rs` in Rust code (via `package = "carve-lang"`) so it does
# not collide with our own `carve` #[pymodule]. The crate is published as
# `carve-lang` (the name `carve` was taken on crates.io).
#
# scripts/pinned-spec-commit.py resolves the exact engine revision to its spec corpus.
carve_rs = { package = "carve-lang", git = "https://github.com/markup-carve/carve-rs", rev = "675edf586160b181c943530ea2bef2d687e2ca20" }
#
# For local development against a sibling checkout, swap the line above for a
# path dependency:
# carve_rs = { package = "carve-lang", path = "../carve-rs" }
